llm_provider:
  deepseek:
    models: # 可用模型
      - deepseek-v4-pro
      - deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    reasoning_effort: max # 推理力度
    context_limit: 200000 # 上下文限制
  openai:
    models: # 可用模型
      - gpt-5.5
    base_url: https://api.openai.com/v1
    reasoning_effort: xhigh # 推理力度
    context_limit: 200000 # 上下文限制
  anthropic:
    models: # 可用模型
      - claude-sonnet-4-6
    base_url: https://api.anthropic.com
    reasoning_effort: high # 推理力度
    context_limit: 200000 # 上下文限制
  ollama:
    models: # 可用模型
      - Qwen3.6-27B-Claude-Opus-Reasoning-Distill-v2-abliterated-OptiQ-4bit-mlx
      - Qwen3.6-35B-A3B-Claude-4.7-Opus-Reasoning-Distilled-oQ6e
      - Qwen3.6-35B-A3B-6bit
      - Qwen3.6-35B-A3B-4bit
      - Qwen3.6-27B-4bit
    base_url: http://127.0.0.1:8000/v1
    reasoning_effort: high
    preserve_thinking: true # Qwen3.6 agent 场景保留历史 reasoning
    context_limit: 70000 # 上下文限制

llm:
  default: # 默认模型
    provider: ollama # 模型提供商
    model: Qwen3.6-35B-A3B-Claude-4.7-Opus-Reasoning-Distilled-oQ6e
    concurrency: 5 # 最大并发数量
    max_retries: 3 # 重试次数

tool:
  page_token_rate: 0.03 # 工具调用结果每页最多占上下文比例

permission:
  rules: [] # 按工具调用参数匹配，字段：tool/args/permission；permission 支持 allow | deny；未匹配时询问
  # rules 示例：
  #   - { tool: shell, args: { command: ["uv run:*", "pytest *"] }, permission: allow }
  #   - { tool: shell, args: { command: "sudo *" }, permission: deny }

compact:
  auto_compact_rate: 0.8 # 达到上下文多少时进行压缩
  keep_recent_tool_results: 3 # 保留最近N组工具调用结果
  keep_recent_user_turns: 3 # 压缩时保留最近N次用户输入及其后的完整原始对话
  keep_recent_messages_token_rate: 0.25 # 最近原始对话最多保留上下文窗口的比例，低于最小轮次时仍保留最小轮次

events:
    level: progress   # progress | detail | trace
