llm_provider:
  deepseek:
    web: provider # local 使用本地后端；provider 优先原生能力，不支持时回退本地
    models:
      - deepseek-v4-pro
      - deepseek-v4-flash
    base_url: https://api.deepseek.com
    reasoning_effort: high # 推理力度
    context_limit: 1000000 # 上下文限制
  openai:
    web: local
    models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna
    base_url: https://api.openai.com/v1
    reasoning_effort: max # 推理力度
    context_limit: 1000000 # 上下文限制
  anthropic:
    web: local
    models:
      - claude-opus-4-8
      - claude-sonnet-5
    base_url: https://api.anthropic.com
    max_pause_turn_continuations: 5 # pause_turn 协议终态的单轮最大自动续接次数
    reasoning_effort: high # 推理力度
    context_limit: 1000000 # 上下文限制
  ollama:
    web: local
    base_url: http://127.0.0.1:8001/v1
    reasoning_effort: high
    preserve_thinking: true # Qwen3.6 agent 场景保留历史 reasoning
    context_limit: 262144 # 上下文限制
  moonshot:
    web: local
    base_url: https://api.moonshot.cn/v1 # 可被 MOONSHOT_API_URL 覆盖
    reasoning_effort: max # 恒开思考，当前仅支持 max
    context_limit: 1000000 # 上下文限制

llm:
  default: deepseek-v4-flash # 必填，默认模型，子agent通过别名引用
  # best: ...                   # 可选，最强模型，不填时使用 default
  # fast: ...                   # 可选，最快/最便宜模型，不填时使用 default
  concurrency: 5 # 最大并发数量
  timeout_seconds: 120 # 单次 LLM 请求超时秒数
  retry:
    max_attempts: 3 # 最大尝试次数，包含首次调用
    base_delay_seconds: 2 # 指数退避基础秒数
    max_delay_seconds: 60 # 单次退避最大秒数
  user_agent: "claude-cli/2.1.201 (external, cli)" # 自定义所有 LLM 请求的 User-Agent；留空则沿用各 SDK 默认 UA

tool:
  page_token_rate: 0.03 # 工具调用结果每页最多占上下文比例

compact:
  auto_compact_rate: 0.8 # context_limit 已知且输入估算超过该比例时自动压缩；context_limit<=0 时禁用
  keep_recent_user_turns: 3 # 优先保留原文的最近 N 个用户轮次范围
  keep_recent_messages_token_rate: 0.25 # 近期原文的硬预算比例；超限时可在优先轮次内部按原子消息块切分

# 激活角色及主 Agent 覆盖。缺省角色时回退 coding。
role:
  default: coding
  coding:
    model: best
    reasoning_effort: max

events:
  level: detail   # progress | detail | trace

logging:
  level: info    # debug | info | warning | error
