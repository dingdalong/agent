llm_provider:
  deepseek:
    web: provider # local 使用本地后端；provider 优先原生能力，不支持时回退本地
    base_url: https://api.deepseek.com
    context_limit: 1000000 # 上下文限制
  openai:
    web: provider
    base_url: https://api.openai.com/v1
    context_limit: 1000000 # 上下文限制
  anthropic:
    web: provider
    base_url: https://api.anthropic.com
    max_pause_turn_continuations: 5 # pause_turn 协议终态的单轮最大自动续接次数
    context_limit: 1000000 # 上下文限制
  ollama:
    web: local
    base_url: http://127.0.0.1:8001/v1
    preserve_thinking: true # Qwen3.6 agent 场景保留历史 reasoning
    context_limit: 200000 # 上下文限制
  moonshot:
    web: local
    base_url: https://api.moonshot.cn/v1 # 可被 MOONSHOT_API_URL 覆盖
    context_limit: 1000000 # 上下文限制

llm:
  concurrency: 5 # 最大并发数量
  timeout_seconds: 120 # 单次 LLM 请求超时秒数
  retry:
    max_attempts: 10 # 最大尝试次数，包含首次调用
    base_delay_seconds: 2 # 指数退避基础秒数
    max_delay_seconds: 300 # 单次退避最大秒数
  user_agent: "claude-cli/2.1.201 (external, cli)" # 自定义所有 LLM 请求的 User-Agent；留空则沿用各 SDK 默认 UA

tool:
  output_tokens: 10000 # 按约 4 UTF-8 字节/token 整理输出，不等同于 API 计费
  max_output_tokens: 16000
  artifact_max_bytes: 1048576
  artifact_total_bytes: 33554432

compact:
  auto_compact_rate: 0.8 # context_limit 已知且输入估算超过该比例时自动压缩；context_limit<=0 时禁用
  keep_recent_user_turns: 3 # 优先保留原文的最近 N 个用户轮次范围
  keep_recent_messages_token_rate: 0.25 # 近期原文的硬预算比例；超限时可在优先轮次内部按原子消息块切分

# 跨 agent 共享上下文：子 agent 的返回报告自动记账，并在后续委派时自动透传，
# 避免每个子 agent 重新探索同一处代码。仅在角色启用 subagent feature 时生效。
context:
  enabled: true # 总开关；false 时完全退化为无账本行为，便于 A/B 对比与回滚
  max_entries: 60 # 内存中保留的条目上限，超限丢最旧
  max_entry_chars: 8000 # 单条正文的存储上限，超出截尾
  inject_char_budget: 6000 # 单次委派注入的总字符预算（约 2000-2500 token）
  inject_entry_chars: 2000 # 单条注入的字符上限，超出截尾并指向完整记录文件
  record_types: [explore, review, coder] # 允许自动记账的子 agent 类型白名单

# 激活角色（role.default）及各角色的模型与推理力度。缺省角色时回退 coding。
# 模型槽位使用 供应商/模型ID，两个都必填且无内置兜底值，由首次配置向导或 /models
# 写入全局 ~/.agent/config.yaml 或项目 .agent/config.yaml：
#   role.<角色>.model.default — 主 Agent 与声明 model: default 的子 agent
#   role.<角色>.model.fast    — 声明 model: fast 的子 agent 与智能权限裁决
# 例：
#   role:
#     coding:
#       model:
#         default: anthropic/claude-opus-5
#         fast: deepseek/deepseek-v4-flash
role:
  default: coding
  coding:
    reasoning_effort: max # 角色级推理力度，两个槽位共用

events:
  level: detail   # progress | detail | trace

logging:
  level: info    # debug | info | warning | error

# shell 留空使用系统账户 Shell；Linux 需要 Bubblewrap 0.11+（--bind-fd）与 libseccomp。
shell:
  shell: null
  bubblewrap: null # 留空从 PATH 查找；配置时使用绝对路径
