[project]
name = "agent"
version = "0.1.0"
description = "my ai test"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.26.0",
    "anthropic>=0.97.0",
    "python-dotenv>=0.19.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "tokenizers>=0.22",
    "ddgs>=9.14.1",
    "urllib3>=2.6.0",
    "tiktoken>=0.12.0",
    "jinja2>=3.1.6",
    "textual==8.2.8",
    "rich>=15.0.0",
    "mcp>=1.8.0",
    "ripgrep>=15.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pyinstaller>=6.22"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-data]
"*" = ["*.md", "**/*.md", "*.tcss", "**/*.tcss", "*.yaml", "**/*.yaml", "*.json", "**/*.json"]

[project.scripts]
agent = "main:cli"
