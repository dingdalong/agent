[project]
name = "agent"
version = "0.1.0"
description = "my ai test"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.26.0",
    "anthropic>=0.97.0",
    "python-dotenv>=0.19.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "pytest>=9.0.3",
    "transformers>=5.6.2",
    "ddgs>=9.14.1",
    "tiktoken>=0.12.0",
    "pathspec>=0.12.1",
    "jinja2>=3.1.6",
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"*" = ["*.md", "**/*.md"]

[project.scripts]
agent = "main:cli"
